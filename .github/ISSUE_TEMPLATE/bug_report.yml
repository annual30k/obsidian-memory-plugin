name: Bug report
description: Report a reproducible plugin problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please redact Vault paths, note contents, and all credentials. For security issues, use private reporting instead of this form.
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - OpenClaw
        - Codex
        - Hermes
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: List the smallest redacted steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
