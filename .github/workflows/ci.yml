name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Codex manifest
        run: npm run check:codex

      - name: Verify package contents
        run: npm pack --dry-run
