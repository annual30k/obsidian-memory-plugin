name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ${{ matrix.os }}
    # Windows support is experimental (never verified on a real machine; several tests still assume POSIX
    # paths, file modes and file locking). Its job runs and reports, but does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      # The tests start Python through scripts/python.mjs; point it at the interpreter set up below
      # (on Windows the `py` launcher would otherwise pick another preinstalled Python without PyYAML).
      PYTHON: python
    strategy:
      # Report every platform: one failing OS must not cancel the others.
      fail-fast: false
      matrix:
        # macOS is where users run the MLX backend and the Unix-socket transport.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        # Hermes loads its plugin settings from config.yaml with PyYAML (bundled with Hermes itself).
        run: python -m pip install pyyaml

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Antigravity manifest
        run: npm run check:antigravity

      - name: Validate Codex manifest
        run: npm run check:codex

      - name: Verify package contents
        run: npm pack --dry-run
