name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Antigravity manifest
        run: npm run check:antigravity

      - name: Validate Codex manifest
        run: npm run check:codex

      - name: Verify package contents
        run: npm pack --dry-run
