name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ${{ matrix.os }}
    env:
      # The tests start Python through scripts/python.mjs; point it at the interpreter set up below
      # (on Windows the `py` launcher would otherwise pick another preinstalled Python without PyYAML).
      PYTHON: python
    strategy:
      # Report every platform: one failing OS must not cancel the others.
      fail-fast: false
      matrix:
        # macOS is where users run the MLX backend and the Unix-socket transport.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        # Hermes loads its plugin settings from config.yaml with PyYAML (bundled with Hermes itself).
        run: python -m pip install pyyaml

      - name: Diagnose Laya service start-up (macOS)
        # The service tests time out on the macOS runner without output; show what one start-up does.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          D=$(mktemp -d)
          python -X importtime -B lib/laya-service/service.py --backend mock --service-file "$D/service.json" --token diag-token --port 0 > "$D/out" 2> "$D/err" &
          PID=$!
          for i in $(seq 1 60); do [ -f "$D/service.json" ] && break; sleep 0.5; done
          echo "service.json after ${i} polls: $(ls "$D")"
          echo "process alive: $(kill -0 $PID 2>/dev/null && echo yes || echo no)"
          echo "--- stderr (without import timings)"; grep -v '^import time:' "$D/err" | tail -40
          echo "--- stdout"; tail -20 "$D/out"
          echo "--- slowest imports"; grep '^import time:' "$D/err" | sort -t'|' -k2 -n | tail -8
          kill $PID 2>/dev/null || true

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Antigravity manifest
        run: npm run check:antigravity

      - name: Validate Codex manifest
        run: npm run check:codex

      - name: Verify package contents
        run: npm pack --dry-run
